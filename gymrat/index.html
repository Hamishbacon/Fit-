<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Rat 2000: The Mogging Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" hidden></canvas>
<div id="bubbles"></div>

<div id="hud" hidden>
  <div class="tl">
    <div class="stat money"><span id="h_money">$0</span></div>
    <div class="lvl"><span class="badge">LV <b id="h_lvl">1</b></span><div class="bar xp"><i id="h_xpf"></i></div></div>
    <div class="lvl"><span class="badge en">⚡</span><div class="bar en"><i id="h_enf"></i></div></div>
    <div class="mini-stats"><span>👥 <b id="h_fol">0</b></span><span>⭐ <b id="h_rep">0</b></span><span id="h_buffs"></span></div>
  </div>
  <div class="tr">
    <canvas id="minimap" width="176" height="176"></canvas>
    <div class="clock"><span id="h_time"></span><span id="h_wx"></span></div>
    <div class="phonehint">📱 <span class="k">F</span> <em id="h_notif" hidden>0</em></div>
    <div id="h_fps"></div>
  </div>
  <div id="quests"></div>
  <div class="keys">🎒 I • 😎 B • 🗺️ M • 📸 C • ⏸ Esc</div>
</div>
<div id="prompt"></div>
<div id="banner"></div>
<div id="floats"></div>
<div id="toasts"></div>
<div id="panels"></div>
<div id="dialogue" hidden></div>
<div id="photoui" hidden></div>
<div id="compcard" hidden></div>
<div id="phone" hidden><div class="bezel"><div class="speaker"></div><div class="screen"></div><div class="homebtn"></div></div></div>
<div id="fade"></div>
<div id="flash"></div>
<div id="menu" hidden></div>
<div id="loading"><div class="ll">GYM RAT 2000</div><div class="ls">THE MOGGING ERA</div><div class="spin"></div><div id="loadtxt">Loading…</div></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/post/CopyShader.js"></script>
<script src="vendor/post/EffectComposer.js"></script>
<script src="vendor/post/RenderPass.js"></script>
<script src="vendor/post/ShaderPass.js"></script>
<script src="vendor/post/LuminosityHighPassShader.js"></script>
<script src="vendor/post/UnrealBloomPass.js"></script>
<script src="vendor/post/FXAAShader.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/input.js"></script>
<script src="js/gfx/textures.js"></script>
<script src="js/gfx/geo.js"></script>
<script src="js/gfx/head.js"></script>
<script src="js/gfx/hair.js"></script>
<script src="js/gfx/anim.js"></script>
<script src="js/gfx/character.js"></script>
<script src="js/gfx/props.js"></script>
<script src="js/world/world.js"></script>
<script src="js/world/city.js"></script>
<script src="js/world/interiors.js"></script>
<script src="js/systems/npc.js"></script>
<script src="js/systems/traffic.js"></script>
<script src="js/systems/minigames.js"></script>
<script src="js/systems/shops.js"></script>
<script src="js/systems/apartment.js"></script>
<script src="js/systems/phone.js"></script>
<script src="js/systems/competitions.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/game.js"></script>
<script>window.addEventListener('load', () => GR.Menu.boot());</script>
</body>
</html>

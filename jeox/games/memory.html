<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Match</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 30% 20%, #3b2f8f, #17123d);
    color: #fff; font-family: system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; overflow: hidden;
  }
  .hud { display: flex; gap: 20px; align-items: center; margin-bottom: 2vh; font-weight: 700; font-size: clamp(14px, 2.6vh, 20px); }
  button.r { background: #fff; color: #3b2f8f; border: 0; border-radius: 8px; padding: 6px 14px; font-weight: 800; cursor: pointer; }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vh;
    width: min(92vw, 72vh);
  }
  .c { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
  .c.up .in, .c.done .in { transform: rotateY(180deg); }
  .f, .b {
    position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden;
    display: grid; place-items: center; font-size: clamp(22px, 6vh, 48px);
  }
  .f { background: linear-gradient(135deg, #7d6bff, #5641e0); box-shadow: inset 0 0 0 3px rgba(255,255,255,.2); }
  .f::after { content: "?"; font-weight: 900; opacity: .5; font-size: .7em; }
  .b { background: #fff; transform: rotateY(180deg); }
  .c.done .b { background: #c8f7dc; }
  .win { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.6); text-align: center; }
  .win.show { display: grid; }
  .win h2 { font-size: 2.2rem; margin: 0 0 8px; }
</style>
</head>
<body>
  <div class="hud"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0</b>/8</span><button class="r" id="restart">Restart</button></div>
  <div class="board" id="board"></div>
  <div class="win" id="win"><div><h2>You did it! 🎉</h2><p id="msg"></p><button class="r" id="again">Play again</button></div></div>
<script>
const ICONS = ["🍎","🚀","🐶","🎸","🌵","🍕","⚽","🦄"];
const board = document.getElementById("board");
let first = null, lock = false, moves = 0, pairs = 0;

function start() {
  board.innerHTML = ""; first = null; lock = false; moves = 0; pairs = 0; update();
  document.getElementById("win").classList.remove("show");
  const deck = [...ICONS, ...ICONS].sort(() => Math.random() - .5);
  deck.forEach(icon => {
    const c = document.createElement("div");
    c.className = "c"; c.dataset.icon = icon;
    c.innerHTML = `<div class="in"><div class="f"></div><div class="b">${icon}</div></div>`;
    c.onclick = () => flip(c);
    board.appendChild(c);
  });
}
function update() {
  document.getElementById("moves").textContent = moves;
  document.getElementById("pairs").textContent = pairs;
}
function flip(c) {
  if (lock || c === first || c.classList.contains("done")) return;
  c.classList.add("up");
  if (!first) { first = c; return; }
  moves++;
  if (first.dataset.icon === c.dataset.icon) {
    first.classList.add("done"); c.classList.add("done"); first = null; pairs++;
    update();
    if (pairs === ICONS.length) setTimeout(() => {
      document.getElementById("msg").textContent = `Finished in ${moves} moves.`;
      document.getElementById("win").classList.add("show");
    }, 400);
  } else {
    lock = true; update();
    const a = first; first = null;
    setTimeout(() => { a.classList.remove("up"); c.classList.remove("up"); lock = false; }, 750);
  }
}
document.getElementById("restart").onclick = start;
document.getElementById("again").onclick = start;
start();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Kings Pool</title>
<style>
:root{--bg:#0a0e13;--panel:rgba(16,22,30,.86);--panel2:rgba(26,34,46,.92);--line:rgba(255,255,255,.09);--txt:#eef2f6;--mut:#8fa0b2;--acc:#ffc93c;--good:#43d67b;--bad:#ff5b5b;--blue:#4aa8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 45%,#1f2c38 0%,#0d1319 55%,#06090c 100%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
/* ---------- HUD ---------- */
#hud{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 58px 6px 14px;min-height:76px}
.pp{display:flex;align-items:center;gap:10px;min-width:0;flex:1;padding:6px 12px 6px 6px;border-radius:40px;background:var(--panel);border:1px solid var(--line);transition:box-shadow .25s,border-color .25s,opacity .25s;opacity:.62}
.pp.right{flex-direction:row-reverse;padding:6px 6px 6px 12px;text-align:right}
.pp.active{opacity:1;border-color:rgba(255,201,60,.55);box-shadow:0 0 0 1px rgba(255,201,60,.25),0 0 22px rgba(255,201,60,.18)}
.avatar{position:relative;width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:linear-gradient(145deg,#3a4a5c,#1b2430);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.avatar svg{position:absolute;inset:-3px;width:54px;height:54px;transform:rotate(-90deg)}
.avatar .trk{fill:none;stroke:rgba(255,255,255,.08);stroke-width:3}
.avatar .bar{fill:none;stroke:var(--acc);stroke-width:3;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:157;transition:stroke .3s}
.avatar .bar.warn{stroke:var(--bad)}
.pinfo{min-width:0;display:flex;flex-direction:column;gap:2px}
.pname{font-size:13px;font-weight:700;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pscore{font-size:20px;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.pballs{display:flex;gap:3px;flex-wrap:nowrap;min-height:18px}
.pp.right .pballs{justify-content:flex-end}
#center{flex:none;width:min(30vw,300px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
#modeLabel{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--mut)}
#turnMsg{font-size:14px;font-weight:700;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#rackRow{display:flex;gap:3px;justify-content:center;min-height:18px}
#menuBtn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:18px}
#menuBtn:hover{background:var(--panel2)}
.bi{--c:#888;width:18px;height:18px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;color:#111;position:relative;background:var(--c);box-shadow:inset -2px -3px 5px rgba(0,0,0,.45),inset 2px 2px 3px rgba(255,255,255,.3);transition:opacity .3s,transform .3s}
.bi::before{content:'';position:absolute;width:9.5px;height:9.5px;border-radius:50%;background:#f8f6ee}
.bi b{position:relative}
.bi.st{background:linear-gradient(#f4f1e6 0 25%,var(--c) 25% 75%,#f4f1e6 75%)}
.bi.cueb{background:#f5f2e8}.bi.cueb::before{display:none}
.bi.gone{opacity:.16;filter:grayscale(1);transform:scale(.85)}
.bi.empty{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.bi.empty::before{display:none}
.bi.next{box-shadow:0 0 0 2px var(--acc),inset -2px -3px 5px rgba(0,0,0,.45)}
/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.widget{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:2px;color:var(--mut)}
#spinW{left:14px;top:50%;transform:translateY(-50%)}
#spinBall{width:66px;height:66px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#fff 0,#ecebe4 35%,#b9b7ad 85%,#8f8d84 100%);box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.2);cursor:pointer;touch-action:none}
#spinBall::before,#spinBall::after{content:'';position:absolute;background:rgba(0,0,0,.14)}
#spinBall::before{left:50%;top:10%;bottom:10%;width:1px}
#spinBall::after{top:50%;left:10%;right:10%;height:1px}
#spinDot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7b7b,#c81616);box-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none;z-index:1}
#powerW{right:14px;top:50%;transform:translateY(-50%)}
#powerTrack{width:34px;height:min(56vh,300px);border-radius:18px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.25));border:1px solid var(--line);position:relative;overflow:hidden;cursor:ns-resize;touch-action:none;box-shadow:inset 0 2px 10px rgba(0,0,0,.6)}
#powerFill{position:absolute;left:0;right:0;top:0;height:0;background:linear-gradient(#3ee07f,#f5d33b 55%,#ff4d3d);opacity:.92}
#powerCue{position:absolute;left:50%;width:8px;margin-left:-4px;top:6px;height:calc(100% - 12px);border-radius:4px;background:linear-gradient(90deg,#7a4a22,#e5c58e 45%,#a06a35);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
#powerCue::before{content:'';position:absolute;left:0;right:0;bottom:0;height:10px;border-radius:0 0 4px 4px;background:linear-gradient(#f3efe6,#f3efe6 70%,#3a74c9 70%)}
#powerPct{min-height:12px;color:var(--txt);letter-spacing:1px}
#stage.portrait #spinW{top:auto;bottom:12px;transform:none}
#stage.portrait #powerW{top:auto;bottom:12px;transform:none}
#stage.portrait #powerTrack{height:118px}
#stage.portrait #spinBall{width:58px;height:58px}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);padding:9px 18px;border-radius:24px;background:rgba(10,14,19,.9);border:1px solid var(--line);font-weight:800;font-size:14px;letter-spacing:.3px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:rgba(255,91,91,.6);color:#ffd3d3}
#toast.good{border-color:rgba(67,214,123,.6);color:#d4ffe4}
#toast.gold{border-color:rgba(255,201,60,.7);color:#ffeab0}
#hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;color:var(--mut);white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}
/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,7,10,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:10;padding:16px;overflow:auto;touch-action:pan-y}
#overlay.show{display:flex}
.card{width:min(720px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#18212c,#10161e);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:0 30px 80px rgba(0,0,0,.6);touch-action:pan-y}
.card.small{width:min(420px,100%)}
.logo{text-align:center;margin-bottom:14px}
.logo .crown{font-size:34px;color:var(--acc);line-height:1;filter:drop-shadow(0 4px 10px rgba(255,201,60,.35))}
.logo h1{margin:4px 0 2px;font-size:30px;letter-spacing:5px;font-weight:900;background:linear-gradient(#fff,#c9d3de);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:0;color:var(--mut);font-size:13px;letter-spacing:2px}
.sec{margin:12px 0}
.sec>label,.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--mut);margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700;transition:background .15s,border-color .15s}
.seg button:hover{background:rgba(255,255,255,.08)}
.seg button.on{background:linear-gradient(180deg,rgba(255,201,60,.22),rgba(255,201,60,.08));border-color:rgba(255,201,60,.65);color:#fff}
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opp{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.035);text-align:left;position:relative}
.opp:hover{background:rgba(255,255,255,.07)}
.opp.on{border-color:rgba(255,201,60,.7);background:rgba(255,201,60,.1)}
.opp.locked{opacity:.42;cursor:not-allowed}
.opp .av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.opp .nm{font-weight:800;font-size:13.5px}
.opp .tg{font-size:11px;color:var(--mut)}
.opp .st{color:var(--acc);font-size:11px;letter-spacing:1px}
.opp .lk{position:absolute;right:10px;top:9px;font-size:13px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.opts .seg button{min-width:0;padding:8px 6px;font-size:13px}
.swatches{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sw.on{border-color:var(--acc)}
.play{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:4px;color:#1b1406;background:linear-gradient(180deg,#ffd970,#f0a920);box-shadow:0 10px 26px rgba(240,169,32,.3),inset 0 1px 0 rgba(255,255,255,.6)}
.play:hover{filter:brightness(1.06)}
.btn{display:block;width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;letter-spacing:1px}
.btn:hover{background:rgba(255,255,255,.1)}
.foot{margin-top:12px;text-align:center;color:var(--mut);font-size:12px}
.foot a{color:var(--blue);cursor:pointer;text-decoration:underline}
.result h2{text-align:center;margin:4px 0;font-size:28px;letter-spacing:2px}
.result .why{text-align:center;color:var(--mut);margin-bottom:14px;font-size:14px}
table.stats{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.stats th,table.stats td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center}
table.stats th:first-child,table.stats td:first-child{text-align:left;color:var(--mut)}
table.stats .big{font-size:20px;font-weight:900;color:var(--acc)}
.help h3{margin:14px 0 6px;font-size:13px;letter-spacing:2px;color:var(--acc)}
.help p,.help li{font-size:13.5px;line-height:1.5;color:#cfd8e2;margin:4px 0}
.help ul{padding-left:18px;margin:4px 0}
.new{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:8px;background:var(--good);color:#06240f;font-size:11px;font-weight:900}
@media (max-width:640px){
  #hud{padding:6px 50px 4px 8px;gap:6px;min-height:64px}
  .avatar{width:38px;height:38px;font-size:12px}.avatar svg{width:44px;height:44px}
  .pp{gap:6px;padding:4px 8px 4px 4px}.pp.right{padding:4px 4px 4px 8px}
  .pscore{font-size:16px}.pname{font-size:11px}
  .bi{width:13px;height:13px;font-size:0}.bi::before{width:6px;height:6px}
  #center{width:auto;max-width:28vw}#turnMsg{font-size:11px}#modeLabel{font-size:9px;letter-spacing:2px}
  #menuBtn{width:34px;height:34px;right:8px}
  .opts{grid-template-columns:1fr}
}
@media (max-height:500px){
  #hud{min-height:50px;padding-top:4px;padding-bottom:2px}
  .avatar{width:34px;height:34px;font-size:11px}.avatar svg{width:40px;height:40px}
  .pp{padding:3px 8px 3px 3px}.pp.right{padding:3px 3px 3px 8px}.pscore{font-size:15px}
  .bi{width:13px;height:13px;font-size:0}.bi::before{width:6px;height:6px}
  #spinBall{width:52px;height:52px}#powerTrack{height:min(48vh,220px)}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="pp" id="pp0">
      <div class="avatar"><svg viewBox="0 0 54 54"><circle class="trk" cx="27" cy="27" r="25"/><circle class="bar" cx="27" cy="27" r="25"/></svg><span class="ini">P1</span></div>
      <div class="pinfo"><div class="pname">Player 1</div><div class="pscore">0</div><div class="pballs"></div></div>
    </div>
    <div id="center"><div id="modeLabel">8-BALL</div><div id="turnMsg"></div><div id="rackRow"></div></div>
    <div class="pp right" id="pp1">
      <div class="avatar"><svg viewBox="0 0 54 54"><circle class="trk" cx="27" cy="27" r="25"/><circle class="bar" cx="27" cy="27" r="25"/></svg><span class="ini">P2</span></div>
      <div class="pinfo"><div class="pname">Player 2</div><div class="pscore">0</div><div class="pballs"></div></div>
    </div>
    <button id="menuBtn" title="Menu (Esc)">&#9776;</button>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="widget" id="spinW"><div id="spinBall"><div id="spinDot"></div></div><span>SPIN</span></div>
    <div class="widget" id="powerW"><span id="powerPct"></span><div id="powerTrack"><div id="powerFill"></div><div id="powerCue"></div></div><span>POWER</span></div>
    <div id="toast"></div>
    <div id="hint"></div>
  </main>
</div>
<div id="overlay"></div>

<script>
'use strict';
/* =====================================================================
   POCKET KINGS POOL — 8-Ball & 9-Ball, 2 players or vs a ladder of AIs
   ===================================================================== */
const W=1000,H=500,R=11.5,CUSH=24,WOOD=44,RAIL=CUSH+WOOD;
const FR=150,KD=0.55,MINV=5,E_BALL=0.95,E_RAIL=0.74,MAXV=2600,NAT=0.22,DT=1/120;
const COLORS=['#f7f4ea','#f2bf12','#1c4fd6','#d42a22','#5b2c96','#f36a10','#108049','#7f1a1a','#141414','#f2bf12','#1c4fd6','#d42a22','#5b2c96','#f36a10','#108049','#7f1a1a'];
const RGB=COLORS.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const FELTS=[{n:'Tournament green',c:'#17794a'},{n:'Royal blue',c:'#1c5ea8'},{n:'Crimson',c:'#8f2430'},{n:'Purple',c:'#4b2d86'},{n:'Teal',c:'#0f7378'},{n:'Charcoal',c:'#33393f'}];
const AIS=[
 {name:'Rookie Rex',  ini:'RR',tag:'Just learning the game',col:'#4cb85e',err:1.0, perr:.10,cands:5, powers:[1.35],          spins:[0],        noise:900,posW:0,  safeW:0,  maxCut:.45,think:1.0,safety:false,kicks:false},
 {name:'Lucky Lou',   ini:'LL',tag:'Pub-league regular',    col:'#3aa2d6',err:.65, perr:.07,cands:7, powers:[1.15,1.7],     spins:[0],        noise:500,posW:0,  safeW:20, maxCut:.38,think:.9, safety:true, kicks:false},
 {name:'Shark Sam',   ini:'SS',tag:'Hustles for a living',  col:'#e59c32',err:.40, perr:.05,cands:9, powers:[1,1.35,1.9],   spins:[0],        noise:250,posW:50, safeW:40, maxCut:.32,think:.85,safety:true, kicks:false},
 {name:'Velvet Viv',  ini:'VV',tag:'Plays perfect position',col:'#d65db1',err:.25, perr:.04,cands:10,powers:[1,1.35,1.9],   spins:[0,-.6,.6], noise:120,posW:90, safeW:60, maxCut:.28,think:.8, safety:true, kicks:true},
 {name:'Professor Q', ini:'PQ',tag:'Calculates everything', col:'#9b6dff',err:.14, perr:.025,cands:12,powers:[1,1.3,1.8,2.4],spins:[0,-.7,.6],noise:50, posW:130,safeW:80, maxCut:.25,think:.7, safety:true, kicks:true},
 {name:'The Phantom', ini:'TP',tag:'Has never missed',      col:'#ff4d4d',err:.06, perr:.015,cands:14,powers:[1,1.3,1.8,2.4],spins:[0,-.8,.7],noise:15, posW:160,safeW:100,maxCut:.22,think:.6, safety:true, kicks:true},
];
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const isStripe=id=>id>8;
const groupOf=id=>id===0||id===8?null:(id<8?'solids':'stripes');

/* ---------------- saved settings ---------------- */
const KEY='pocketkings_pool_v1';
function loadCfg(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
const cfg=Object.assign({mode:'8',opp:'ai',lvl:0,progress:0,best:[0,0,0,0,0,0],beat:[0,0,0,0,0,0],wins:0,games:0,hi:0,guide:'long',clock:30,sound:true,felt:0,breaker:0},loadCfg());
function saveCfg(){try{localStorage.setItem(KEY,JSON.stringify(cfg));}catch(e){}}

/* ---------------- table geometry ---------------- */
const CC=32,SM=25;
const SEGS=[];
function addPath(p){for(let i=0;i<p.length-1;i++){const [ax,ay]=p[i],[bx,by]=p[i+1];SEGS.push({ax,ay,bx,by,l2:(bx-ax)**2+(by-ay)**2});}}
const RAILPATHS=[
 [[CC-14,-CUSH],[CC,0],[W/2-SM,0],[W/2-SM+5,-CUSH]],
 [[W/2+SM-5,-CUSH],[W/2+SM,0],[W-CC,0],[W-CC+14,-CUSH]],
 [[W+CUSH,CC-14],[W,CC],[W,H-CC],[W+CUSH,H-CC+14]],
 [[W-CC+14,H+CUSH],[W-CC,H],[W/2+SM,H],[W/2+SM-5,H+CUSH]],
 [[W/2-SM+5,H+CUSH],[W/2-SM,H],[CC,H],[CC-14,H+CUSH]],
 [[-CUSH,H-CC+14],[0,H-CC],[0,CC],[-CUSH,CC-14]],
];
RAILPATHS.forEach(addPath);
const POCKETS=[
 {x:-8,y:-8,r:23,dr:27,ax:6,ay:6,dx:-.707,dy:-.707},
 {x:W/2,y:-21,r:19,dr:22,ax:W/2,ay:-5,dx:0,dy:-1},
 {x:W+8,y:-8,r:23,dr:27,ax:W-6,ay:6,dx:.707,dy:-.707},
 {x:W+8,y:H+8,r:23,dr:27,ax:W-6,ay:H-6,dx:.707,dy:.707},
 {x:W/2,y:H+21,r:19,dr:22,ax:W/2,ay:H+5,dx:0,dy:1},
 {x:-8,y:H+8,r:23,dr:27,ax:6,ay:H-6,dx:-.707,dy:.707},
];
// felt outline polygon: rail paths joined through the pocket centres
const FELT=[];
RAILPATHS.forEach((p,i)=>{p.forEach(q=>FELT.push(q));const pk=POCKETS[(i+1)%6];FELT.push([pk.x,pk.y]);});
const FOOT={x:W*0.75,y:H/2},HEAD={x:W*0.25,y:H/2};

/* =====================================================================
   PHYSICS (shared by the real game and the AI's look-ahead simulations)
   ===================================================================== */
function newShot(spinF,spinS,dx,dy){return {first:-1,railAfter:false,potted:[],pocketOf:{},rails:new Int16Array(16),travel:0,spinF,spinS,rx:-dy,ry:dx,legal:[],lowest:0};}
function potBall(b,k,S,fx){b.on=false;b.vx=0;b.vy=0;if(S){S.potted.push(b.id);S.pocketOf[b.id]=k;}if(fx)fx.pocket(b,k);}
function physStep(balls,dt,S,fx){
  let mv=0;
  for(let i=0;i<balls.length;i++){const b=balls[i];if(!b.on)continue;const v=b.vx*b.vx+b.vy*b.vy;if(v>mv)mv=v;}
  if(mv===0)return false;
  mv=Math.sqrt(mv);
  const n=Math.min(40,Math.max(1,Math.ceil(mv*dt/(R*0.4)))),h=dt/n,N=balls.length,R2=4*R*R;
  for(let s=0;s<n;s++){
    for(let i=0;i<N;i++){const b=balls[i];if(!b.on||(b.vx===0&&b.vy===0))continue;b.x+=b.vx*h;b.y+=b.vy*h;if(b.id===0&&S&&S.first<0)S.travel+=Math.hypot(b.vx,b.vy)*h;}
    // ball-ball
    for(let i=0;i<N;i++){const a=balls[i];if(!a.on)continue;
      for(let j=i+1;j<N;j++){const b=balls[j];if(!b.on)continue;
        const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;
        if(d2>=R2||d2===0)continue;

/* =====================================================================
   RULES
   ===================================================================== */
function legalFor(mode,grp,balls){
  if(mode==='9'){let low=99;for(const b of balls)if(b.on&&b.id>0&&b.id<low)low=b.id;return low<99?[low]:[];}
  const ids=[];for(const b of balls)if(b.on&&b.id>0&&b.id!==8&&(!grp||groupOf(b.id)===grp))ids.push(b.id);
  if(!ids.length&&balls[8].on)ids.push(8);
  return ids;
}
function judge(mode,grp,isBreak,S){
  const r={foul:false,reason:'',win:0,cont:false,assign:null,respot:[]};
  const objs=S.potted.filter(i=>i>0),cueIn=S.potted.includes(0);
  if(cueIn){r.foul=true;r.reason='Scratch';}
  else if(S.first<0){r.foul=true;r.reason='No ball hit';}
  else if(!S.legal.includes(S.first)){r.foul=true;r.reason=mode==='9'?`Must hit the ${S.legal[0]}-ball first`:(S.first===8?'Hit the 8-ball first':'Wrong ball hit first');}
  else if(!S.railAfter&&!objs.length){r.foul=true;r.reason='No rail after contact';}
  if(mode==='8'){
    if(objs.includes(8)){
      if(isBreak)r.respot.push(8);
      else if(r.foul||!S.legal.includes(8)){r.win=-1;r.reason=r.foul?'8-ball potted on a foul':'8-ball potted too early';}
      else r.win=1;
    }
    if(!r.win&&!r.foul){
      const rest=objs.filter(i=>i!==8);
      if(!grp&&!isBreak&&rest.length)r.assign=groupOf(rest[0]);
      const g=r.assign||grp;
      if(isBreak)r.cont=rest.length>0;
      else if(g)r.cont=rest.some(i=>groupOf(i)===g);
    }
  }else{
    if(objs.includes(9)){if(r.foul)r.respot.push(9);else r.win=1;}
    if(!r.win&&!r.foul)r.cont=objs.length>0;
  }
  return r;
}

let game=null,paused=false;
function mkPlayer(name,isAI,ini,col){return {name,isAI,ini,col,group:null,score:0,potted:0,fouls:0,streak:0,bestStreak:0,shots:0};}
function mkBalls(){const a=[];for(let i=0;i<16;i++)a.push({id:i,x:0,y:0,vx:0,vy:0,on:true,m:randRot(),rc:0,dirty:true,cv:null,lx:0,ly:0,pot:null});return a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function rack(){
  const B=game.balls,dx=R*Math.sqrt(3)+0.2,dy=2*R+0.2,pos=[];
  const rows=game.mode==='8'?[1,2,3,4,5]:[1,2,3,2,1];
  rows.forEach((n,i)=>{for(let j=0;j<n;j++)pos.push({x:FOOT.x+i*dx,y:FOOT.y+(j-(n-1)/2)*dy,row:i,j});});
  let order;
  if(game.mode==='8'){
    const sol=shuffle([1,2,3,4,5,6,7]),str=shuffle([9,10,11,12,13,14,15]);
    const ca=sol.pop(),cb=str.pop(),corners=Math.random()<.5?[ca,cb]:[cb,ca];
    const rest=shuffle(sol.concat(str));order=[];
    for(let i=0;i<15;i++){if(i===4)order.push(8);else if(i===10)order.push(corners[0]);else if(i===14)order.push(corners[1]);else order.push(rest.pop());}
    for(let i=1;i<16;i++)B[i].on=true;
  }else{
    const rest=shuffle([2,3,4,5,6,7,8]);order=[];
    for(let i=0;i<9;i++){if(i===0)order.push(1);else if(i===4)order.push(9);else order.push(rest.pop());}
    for(let i=10;i<16;i++)B[i].on=false;
  }
  order.forEach((id,i)=>{const b=B[id];b.x=pos[i].x+(Math.random()-.5)*0.05;b.y=pos[i].y+(Math.random()-.5)*0.05;b.vx=b.vy=0;b.on=true;b.pot=null;});
  const c=B[0];c.on=true;c.x=W*0.22;c.y=H/2;c.vx=c.vy=0;c.pot=null;
  for(const b of B){b.lx=b.x;b.ly=b.y;b.dirty=true;}
}

function humanTurn(){return game&&!paused&&game.state==='aim'&&!game.players[game.cur].isAI;}

function validSpot(x,y,kitchen,ignore){
  if(x<R+0.5||x>W-R-0.5||y<R+0.5||y>H-R-0.5)return false;
  if(kitchen&&x>W/4)return false;
  for(const b of game.balls){if(!b.on||b.id===ignore)continue;if((b.x-x)**2+(b.y-y)**2<(2*R+0.6)**2)return false;}
  return true;
}
function freeSpot(x,y,kitchen){

  for(let r=4;r<400;r+=4)for(let a=0;a<6.28;a+=0.3){const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(validSpot(px,py,kitchen,0))return {x:px,y:py};}

}
function respot(id){
  const b=game.balls[id];let x=FOOT.x;

  if(x>=W-R){x=FOOT.x;while(x>R&&!validSpot(x,FOOT.y,false,id))x-=1;}

}
function shoot(ang,pow,sx,sy){

function releaseStrike(){

function startPotAnim(b,k){const p=POCKETS[k];b.pot={k,t:0,x0:b.x,y0:b.y,px:p.x,py:p.y};}
function update(dt){
  const g=game;if(!g||paused)return;
  for(const p of g.popups)p.t+=dt;g.popups=g.popups.filter(p=>p.t<1.6);
  for(const b of g.balls)if(b.pot&&b.pot.t<1)b.pot.t+=dt/0.32;
  if(g.state==='aim'){
    if(cfg.clock&&!g.players[g.cur].isAI&&!g.over){
      g.clockLeft-=dt;
      if(g.clockLeft<=0){timeUp();return;}
    }
    if(g.players[g.cur].isAI)runAI(dt);
    if(keys.charging){g.power=clamp(g.power+dt/1.3,0,1);}
    if(keys.left||keys.right){const sp=(keys.shift?0.9:0.12)*dt*(keys.left?-1:1);g.aim+=sp;}
  }else if(g.state==='strike'){
    g.strike.t+=dt;if(g.strike.t>=0.085)releaseStrike();
  }else if(g.state==='rolling'){
    g.acc+=dt;let steps=0;let moving=true;
    while(g.acc>=DT&&steps<8){moving=physStep(g.balls,DT,g.shot,FX);g.acc-=DT;steps++;}
    for(const b of g.balls){if(!b.on)continue;const dx=b.x-b.lx,dy=b.y-b.ly;if(dx||dy){rollBall(b,dx,dy);b.lx=b.x;b.ly=b.y;}}
    let any=false;for(const b of g.balls)if(b.on&&(b.vx||b.vy)){any=true;break;}
    const anim=g.balls.some(b=>b.pot&&b.pot.t<1);

function timeUp(){

  P.score=Math.max(0,P.score-50);P.fouls++;P.streak=0;

function addPopup(x,y,text,col,big){game.popups.push({x,y,text,col:col||'#ffd45c',t:0,big:!!big});}
function resolveShot(){
  const g=game,S=g.shot,me=g.cur,opp=1-me,P=g.players[me],O=g.players[opp];
  const r=judge(g.mode,P.group,g.isBreak,S);
  LOG.push({who:me,plan:g.lastPlan,cont:r.cont,foul:r.reason,pots:S.potted.slice()});g.lastPlan=null;
  // ---- points ----

    addPopup(g.balls[0].on?g.balls[0].x:W/2,g.balls[0].on?g.balls[0].y-28:H/2,'FOUL  -100','#ff6b6b',true);
    FX.foul();
  }else{
    const grp=r.assign||P.group;
    const good=pots.filter(id=>g.mode==='9'||g.isBreak&&id!==8||(id===8&&r.win===1)||(id!==8&&grp&&groupOf(id)===grp));
    good.forEach((id,i)=>{
      P.streak++;P.potted++;P.bestStreak=Math.max(P.bestStreak,P.streak);

    });

  if(!g.balls[0].on){const c=g.balls[0];const s=freeSpot(HEAD.x,HEAD.y,false);c.x=s.x;c.y=s.y;c.on=true;c.pot=null;c.vx=c.vy=0;c.lx=c.x;c.ly=c.y;c.dirty=true;}

function cloneBalls(B){return B.map(b=>({id:b.id,x:b.x,y:b.y,vx:0,vy:0,on:b.on}));}
function shotLines(balls,cx,cy,targets,minCos){
  const out=[];
  for(const id of targets){const T=balls[id];if(!T||!T.on)continue;
    for(let k=0;k<6;k++){const P=POCKETS[k];
      const tx=P.ax-T.x,ty=P.ay-T.y,td=Math.hypot(tx,ty);if(td<1)continue;const ux=tx/td,uy=ty/td;
      if(ux*P.dx+uy*P.dy<(k===1||k===4?0.5:0.3))continue;
      const gx=T.x-ux*2*R,gy=T.y-uy*2*R,vx=gx-cx,vy=gy-cy,vd=Math.hypot(vx,vy);if(vd<2)continue;
      const cxn=vx/vd,cyn=vy/vd,cos=cxn*ux+cyn*uy;if(cos<minCos)continue;
      const c1=castCircle(cx,cy,cxn,cyn,balls,0,-1);
      if(!c1.hit||c1.hit.type!=='ball'||c1.hit.b.id!==id||Math.abs(c1.t-vd)>1.5)continue;
      const c2=castCircle(T.x,T.y,ux,uy,balls,id,0);
      if(c2.hit&&c2.t<td-R-4)continue;
      out.push({id,k,ang:Math.atan2(cyn,cxn),cos,td,vd,diff:(1-cos)*3+td/700+vd/1100});
    }}
  return out;
}
function bihSpots(balls,targets,kitchen){
  const pts=[];
  for(const id of targets){const T=balls[id];if(!T.on)continue;
    for(let k=0;k<6;k++){const P=POCKETS[k],tx=P.ax-T.x,ty=P.ay-T.y,td=Math.hypot(tx,ty),ux=tx/td,uy=ty/td;
      if(ux*P.dx+uy*P.dy<(k===1||k===4?0.5:0.3))continue;
      const gx=T.x-ux*2*R,gy=T.y-uy*2*R;
      for(const dist of [70,140,220])for(const off of [0,0.3,-0.3]){const a=Math.atan2(-uy,-ux)+off;const x=gx+Math.cos(a)*dist,y=gy+Math.sin(a)*dist;if(validSpot(x,y,kitchen,0))pts.push({x,y});}
    }}
  if(!pts.length)for(let x=40;x<W;x+=80)for(let y=40;y<H;y+=70)if(validSpot(x,y,kitchen,0))pts.push({x,y});
  return pts;
}
function simulate(tr,me){
  const g=game,sb=cloneBalls(g.balls);const c=sb[0];c.x=tr.px;c.y=tr.py;c.on=true;
  const dx=Math.cos(tr.ang),dy=Math.sin(tr.ang),S=newShot(tr.sy||0,tr.sx||0,dx,dy);
  S.legal=legalFor(g.mode,g.players[me].group,sb);S.lowest=S.legal[0];
  c.vx=dx*tr.pow*MAXV;c.vy=dy*tr.pow*MAXV;
  for(let i=0;i<2400;i++)if(!physStep(sb,DT,S,null))break;
  return {sb,S,r:judge(g.mode,g.players[me].group,g.isBreak,S)};
}
function scoreSim(res,me,L){
  const g=game,{sb,S,r}=res;
  if(r.win===1)return 1e5;if(r.win===-1)return -1e5;
  let s=0;const grp=r.assign||g.players[me].group;
  const pots=S.potted.filter(i=>i>0);
  if(g.mode==='8'&&grp)for(const id of pots){if(id===8)continue;s+=groupOf(id)===grp?120:-60;}
  else s+=pots.length*60;
  if(r.foul)return s-900;
  const c=sb[0];
  if(r.cont){
    s+=1000;
    if(L.posW){const nl=legalFor(g.mode,grp,sb);const ln=shotLines(sb,c.x,c.y,nl,0.3);
      if(ln.length){let bd=9;for(const l of ln)bd=Math.min(bd,l.diff);s+=Math.min(ln.length,3)*L.posW*0.5+(2.2-bd)*L.posW;}else s-=L.posW*1.5;}
  }else if(L.safeW){

  yield;

    let apex=g.balls[1],bd=1e9;for(const b of g.balls){if(!b.on||!b.id)continue;const d=(b.x-FOOT.x)**2+(b.y-FOOT.y)**2;if(d<bd){bd=d;apex=b;}}

function drawCue(c,cx,cy,ang,pull,alpha){
  const x0=R+3+pull,L=620,w0=2.7,w1=7.2,wAt=x=>w0+(w1-w0)*clamp((x-x0)/L,0,1);
  const poly=(a,b)=>{c.beginPath();c.moveTo(a,-wAt(a));c.lineTo(b,-wAt(b));c.lineTo(b,wAt(b));c.lineTo(a,wAt(a));c.closePath();};

  c.save();c.globalAlpha=alpha;c.translate(cx,cy);c.rotate(ang+Math.PI);
  const secs=[[0,3,'#3d78cc'],[3,15,'#f4f0e6'],[15,340,'#e6c58c'],[340,347,'#c8ccd3'],[347,356,'#1c1c1c'],[356,430,'#6a2c12'],[430,446,'#e8d6a5'],[446,452,'#1c1c1c'],[452,578,'#241109'],[578,620,'#0f0f0f']];
  for(const [a,b,col] of secs){poly(x0+a,x0+b);c.fillStyle=col;c.fill();}
  // decorative points on the forearm
  c.fillStyle='#e8d6a5';for(let i=0;i<4;i++){const y=i%2?1:-1;c.beginPath();c.moveTo(x0+356,y*wAt(x0+356)*0.2);c.lineTo(x0+410,y*wAt(x0+410)*0.95);c.lineTo(x0+356,y*wAt(x0+356)*0.95);c.closePath();c.globalAlpha=alpha*0.5;c.fill();}

}
function drawGuide(c,alpha){

    if(g.bih&&!ai){const t=performance.now()/1000;ctx.strokeStyle=`rgba(255,213,92,${0.55+0.35*Math.sin(t*5)})`;ctx.lineWidth=1.6;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cue.x,cue.y,R*2.1,0,7);ctx.stroke();ctx.setLineDash([]);}

spinBall.addEventListener('pointermove',e=>{if(spinDrag)spinAt(e);});
spinBall.addEventListener('pointerup',()=>spinDrag=false);
spinBall.addEventListener('dblclick',()=>{if(humanTurn()){game.spin={x:0,y:0};setSpinUI();}});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(game&&!game.over){paused?hideOverlay():showPause();}return;}
  if(!game||paused)return;
  keys.shift=e.shiftKey;
  if(e.key==='ArrowLeft'||e.key==='a'){keys.left=true;e.preventDefault();}
  if(e.key==='ArrowRight'||e.key==='d'){keys.right=true;e.preventDefault();}
  if((e.key===' '||e.key==='Enter')&&!e.repeat&&humanTurn()){keys.charging=true;game.power=0;e.preventDefault();}
  if(humanTurn()&&['w','s','ArrowUp','ArrowDown'].includes(e.key)){const dy=e.key==='w'||e.key==='ArrowUp'?0.2:-0.2;game.spin.y=clamp(game.spin.y+dy,-1,1);setSpinUI();e.preventDefault();}
});
addEventListener('keyup',e=>{
  keys.shift=e.shiftKey;
  if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d')keys.right=false;
  if((e.key===' '||e.key==='Enter')&&keys.charging){keys.charging=false;if(humanTurn()&&game.power>0.03)shoot(game.aim,game.power,game.spin.x,game.spin.y);else if(game)game.power=0;}
});
$('#menuBtn').addEventListener('click',()=>{if(!game||game.over)showMenu();else showPause();});

/* =====================================================================
   MENUS
   ===================================================================== */
const ov=$('#overlay');
function hideOverlay(){ov.classList.remove('show');ov.innerHTML='';paused=false;}
function seg(act,opts,cur){return `<div class="seg">${opts.map(([v,l])=>`<button data-act="${act}" data-v="${v}" class="${String(cur)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;}
function showMenu(){
  paused=true;
  if(cfg.lvl>cfg.progress)cfg.lvl=cfg.progress;
  const lad=AIS.map((a,i)=>{const locked=i>cfg.progress;return `<button class="opp ${cfg.lvl===i?'on':''} ${locked?'locked':''}" data-act="lvl" data-v="${i}">
    <div class="av" style="background:linear-gradient(145deg,${a.col},${shade(a.col,-0.55)})">${a.ini}</div>
    <div><div class="nm">${a.name}</div><div class="st">${'★'.repeat(i+1)}${'☆'.repeat(5-i)}</div><div class="tg">${locked?`Beat ${AIS[i-1].name} to unlock`:(cfg.best[i]?`Best score ${cfg.best[i].toLocaleString()}${cfg.beat[i]?' · beaten ✓':''}`:a.tag)}</div></div>${locked?'<span class="lk">🔒</span>':''}</button>`;}).join('');
  ov.innerHTML=`<div class="card">
   <div class="logo"><div class="crown">♛</div><h1>POCKET KINGS</h1><p>8-BALL · 9-BALL POOL</p></div>
   <div class="sec"><label>GAME</label>${seg('mode',[['8','8-Ball'],['9','9-Ball']],cfg.mode)}</div>
   <div class="sec"><label>OPPONENT</label>${seg('opp',[['ai','vs Computer'],['2p','2 Players (same device)']],cfg.opp)}</div>
   ${cfg.opp==='ai'?`<div class="sec"><label>COMPUTER LADDER: BEAT EACH ONE TO UNLOCK THE NEXT</label><div class="ladder">${lad}</div></div>`:''}
   <div class="sec opts">
     <div><span class="lbl">AIM LINE</span>${seg('guide',[['long','Long'],['short','Short'],['off','Off']],cfg.guide)}</div>
     <div><span class="lbl">SHOT CLOCK</span>${seg('clock',[[30,'30s'],[60,'60s'],[0,'Off']],cfg.clock)}</div>
     <div><span class="lbl">CLOTH</span><div class="swatches">${FELTS.map((f,i)=>`<button class="sw ${cfg.felt===i?'on':''}" title="${f.n}" data-act="felt" data-v="${i}" style="background:${f.c}"></button>`).join('')}</div></div>
     <div><span class="lbl">SOUND</span>${seg('sound',[[1,'On'],[0,'Off']],cfg.sound?1:0)}</div>
   </div>
   <button class="play" data-act="play">PLAY</button>
   <div class="foot">Wins vs computer: ${cfg.wins} / ${cfg.games} · High score: ${(cfg.hi||0).toLocaleString()} · <a data-act="help">How to play</a></div>
  </div>`;
  ov.classList.add('show');
}
function showPause(){
  paused=true;
  ov.innerHTML=`<div class="card small"><div class="logo"><div class="crown">♛</div><h1 style="font-size:22px">PAUSED</h1></div>
    <button class="play" data-act="resume">RESUME</button>
    <button class="btn" data-act="restart">Restart game</button>
    <button class="btn" data-act="help">How to play</button>
    <button class="btn" data-act="menu">Quit to menu</button></div>`;
  ov.classList.add('show');
}
function showHelp(back){
  paused=true;
  ov.innerHTML=`<div class="card help"><div class="logo"><h1 style="font-size:22px">HOW TO PLAY</h1></div>
   <h3>CONTROLS</h3><ul>
   <li><b>Mouse:</b> move to aim. Click and drag back to pull the cue, then release to shoot. The further you drag, the harder you hit.</li>
   <li><b>Touch:</b> drag anywhere on the table to aim, then pull the <b>power bar</b> on the right down and let go.</li>
   <li><b>Spin:</b> tap the white ball on the left. Low = draw (backspin), high = follow, left/right = side spin off the cushions. Double-click to reset.</li>
   <li><b>Keyboard:</b> ← → fine aim (hold Shift for faster), ↑ ↓ spin, hold Space to power up and release to shoot, Esc to pause.</li>
   <li>The <b>aim line</b> shows where the cue ball goes, the ghost ball where it makes contact, the white line the object ball's path and the blue line where the cue ball heads after contact. A red ✕ means that ball isn't legal to hit first.</li></ul>
   <h3>8-BALL</h3><p>After the break the table is open. The first ball you pot gives you solids (1–7) or stripes (9–15). Clear your group, then pot the 8-ball to win. Pot the 8 early, or scratch while potting it, and you lose.</p>
   <h3>9-BALL</h3><p>Always hit the lowest-numbered ball first. Any ball potted on a legal shot keeps your turn, and whoever legally pots the 9 wins, even on the break or in a combo.</p>
   <h3>FOULS</h3><p>Potting the cue ball, missing every ball, hitting the wrong ball first, no ball reaching a cushion after contact, or running out the shot clock. Your opponent then gets <b>ball in hand</b>: they can place the cue ball anywhere.</p>
   <h3>SCORING</h3><ul><li>+100 per ball (+300 for the 8 or the 9)</li><li>Streak: +50 for each ball in a row without missing</li><li>+75 for each extra ball in the same shot · +100 bank shot · +100 combo · +75 long pot</li><li>Speed bonus (shot clock on): up to +120 for potting quickly</li><li>+500 for the win · +1000 for break-and-run · −100 per foul · −50 for running out of time</li></ul>
   <button class="play" data-act="${back}">BACK</button></div>`;
  ov.classList.add('show');
}
function showResult(winner,reason,unlocked){
  const g=game,P=g.players,human=g.vsAI&&!P[0].isAI;
  const title=human?(winner===0?'YOU WIN!':`${P[1].name} WINS`):`${P[winner].name} WINS!`;
  const col=human&&winner!==0?'var(--bad)':'var(--acc)';
  const next=human&&winner===0&&g.lvl+1<AIS.length;
  const row=(l,f)=>`<tr><td>${l}</td><td>${f(P[0])}</td><td>${f(P[1])}</td></tr>`;
  ov.innerHTML=`<div class="card small result"><h2 style="color:${col}">${title}</h2>
   <div class="why">${reason||(winner===0||!human?'Clean finish.':'Better luck next time.')}${unlocked?` <span class="new">NEW OPPONENT UNLOCKED</span>`:''}</div>
   <table class="stats"><tr><th></th><th>${P[0].name}</th><th>${P[1].name}</th></tr>
   <tr><td>Score</td><td class="big">${P[0].score.toLocaleString()}</td><td class="big">${P[1].score.toLocaleString()}</td></tr>
   ${row('Balls potted',p=>p.potted)}${row('Best streak',p=>p.bestStreak)}${row('Shots',p=>p.shots)}${row('Fouls',p=>p.fouls)}</table>
   ${next?`<button class="play" data-act="next">NEXT: ${AIS[g.lvl+1].name.toUpperCase()} →</button>`:`<button class="play" data-act="restart">PLAY AGAIN</button>`}
   ${next?`<button class="btn" data-act="restart">Rematch</button>`:''}
   <button class="btn" data-act="menu">Main menu</button></div>`;
  ov.classList.add('show');paused=true;
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;audio();
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='mode'){cfg.mode=v;saveCfg();showMenu();}
  else if(a==='opp'){cfg.opp=v;saveCfg();showMenu();}
  else if(a==='lvl'){const i=+v;if(i<=cfg.progress){cfg.lvl=i;saveCfg();showMenu();}}
  else if(a==='guide'){cfg.guide=v;saveCfg();showMenu();}
  else if(a==='clock'){cfg.clock=+v;saveCfg();showMenu();}
  else if(a==='felt'){cfg.felt=+v;saveCfg();buildTable();showMenu();}
  else if(a==='sound'){cfg.sound=v==='1';saveCfg();showMenu();}
  else if(a==='play'){saveCfg();startGame();}
  else if(a==='resume')hideOverlay();
  else if(a==='restart'){startGame();}
  else if(a==='next'){cfg.lvl=Math.min(cfg.progress,game.lvl+1);saveCfg();startGame();}
  else if(a==='menu')showMenu();
  else if(a==='help')showHelp(game&&!game.over&&ov.querySelector('[data-act=resume]')?'pauseback':'menuback');
  else if(a==='pauseback')showPause();
  else if(a==='menuback')showMenu();
});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last=performance.now();
function frame(t){
  const dt=Math.min(0.05,(t-last)/1000);last=t;
  try{update(dt);render();if(game){updateClockUI();}}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
resize();
// a calm attract-mode table behind the menu
game=null;
(function attract(){cfg.opp=cfg.opp||'ai';const keep=cfg.opp;startGame();paused=true;cfg.opp=keep;updateHUD();
  if(/[?&]demo/.test(location.search)){paused=false;hideOverlay();}else showMenu();})();
requestAnimationFrame(frame);
const LOG=[];window.__pool={LOG,get game(){return game;},cfg,physStep,judge,legalFor};
</script>
</body>
</html>
